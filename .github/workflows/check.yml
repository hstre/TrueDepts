name: Prüfen und veröffentlichen

# Veröffentlicht das Repository-Wurzelverzeichnis auf GitHub Pages: index.html leitet auf site/ weiter.
# Funktioniert gleich, egal ob Pages auf „GitHub Actions“ oder „Deploy from a branch (main, /)“ steht.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Website-Daten aus den versionierten Rohdaten erzeugen
        run: python -m pipeline.build
      - name: Zahlungsströme gegen Emissionsdaten prüfen
        run: python -m pipeline.verify
      - name: Seite zusammenstellen
        run: |
          mkdir -p _pages
          cp index.html .nojekyll _pages/
          cp -r site _pages/site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
