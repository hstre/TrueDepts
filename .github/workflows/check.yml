name: Prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Veröffentlicht wird über GitHub Pages im Modus „Deploy from a branch“ (main, /):
# index.html im Hauptverzeichnis leitet auf site/ weiter. Dieser Workflow prüft nur.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Website-Daten aus den versionierten Rohdaten erzeugen
        run: python -m pipeline.build
      - name: Zahlungsströme gegen Emissionsdaten prüfen
        run: python -m pipeline.verify
